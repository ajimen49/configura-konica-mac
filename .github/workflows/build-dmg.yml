name: Construeix el DMG

on:
  release:
    types: [published]

jobs:
  build-dmg:
    name: Crea el DMG en macOS
    runs-on: macos-latest

    steps:

      - name: Descarrega el repositori
        uses: actions/checkout@v5

      - name: Descarrega el ZIP del Release
        run: |
          ASSET_URL=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets" \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          for a in assets:
              if a['name'].endswith('.zip') and 'Source' not in a['name']:
                  print(a['url'])
                  break
          ")
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o app.zip
          echo "ZIP: $(du -sh app.zip)"

      - name: Descomprimeix i localitza l'app
        run: |
          unzip app.zip
          APP_PATH=$(find . -name "Configura_Konica_Mac.app" -maxdepth 4 | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "APP_DIR=$(dirname $APP_PATH)" >> $GITHUB_ENV
          echo "App trobada: $APP_PATH"

      - name: Descarrega i bundleja JRE ARM64 (Apple Silicon)
        run: |
          echo "Descarregant JRE ARM64..."
          curl -L \
            "https://api.adoptium.net/v3/binary/latest/17/ga/mac/aarch64/jre/hotspot/normal/eclipse" \
            -o jre-arm64.tar.gz
          echo "JRE ARM64: $(du -sh jre-arm64.tar.gz)"

          mkdir -p "${{ env.APP_PATH }}/Contents/Resources/jre/arm64"
          tar -xzf jre-arm64.tar.gz -C /tmp/jre-arm64 --strip-components=1 2>/dev/null || \
            (mkdir -p /tmp/jre-arm64 && tar -xzf jre-arm64.tar.gz -C /tmp/jre-arm64)

          # Copiar el contingut del JRE
          JRE_HOME=$(find /tmp/jre-arm64 -name "bin" -type d | head -1 | xargs dirname)
          cp -r "$JRE_HOME/." "${{ env.APP_PATH }}/Contents/Resources/jre/arm64/"
          echo "JRE ARM64 bundlejat: $(du -sh ${{ env.APP_PATH }}/Contents/Resources/jre/arm64)"

      - name: Descarrega i bundleja JRE x64 (Intel)
        run: |
          echo "Descarregant JRE x64..."
          curl -L \
            "https://api.adoptium.net/v3/binary/latest/17/ga/mac/x64/jre/hotspot/normal/eclipse" \
            -o jre-x64.tar.gz
          echo "JRE x64: $(du -sh jre-x64.tar.gz)"

          mkdir -p "${{ env.APP_PATH }}/Contents/Resources/jre/x64"
          tar -xzf jre-x64.tar.gz -C /tmp/jre-x64 --strip-components=1 2>/dev/null || \
            (mkdir -p /tmp/jre-x64 && tar -xzf jre-x64.tar.gz -C /tmp/jre-x64)

          JRE_HOME=$(find /tmp/jre-x64 -name "bin" -type d | head -1 | xargs dirname)
          cp -r "$JRE_HOME/." "${{ env.APP_PATH }}/Contents/Resources/jre/x64/"
          echo "JRE x64 bundlejat: $(du -sh ${{ env.APP_PATH }}/Contents/Resources/jre/x64)"

      - name: Prepara permisos i crea el DMG
        run: |
          VERSION="${{ github.event.release.tag_name }}"

          xattr -cr "${{ env.APP_PATH }}" 2>/dev/null || true
          chmod +x "${{ env.APP_PATH }}/Contents/MacOS/Configura_Konica_Mac"
          chmod +x "${{ env.APP_PATH }}/Contents/Resources/pc-client-mac.sh"
          chmod +x "${{ env.APP_PATH }}/Contents/Resources/jre/arm64/bin/java" 2>/dev/null || true
          chmod +x "${{ env.APP_PATH }}/Contents/Resources/jre/x64/bin/java" 2>/dev/null || true

          echo "Mida final de l'app: $(du -sh ${{ env.APP_PATH }})"

          hdiutil create \
            -volname "Configura Konica Mac" \
            -srcfolder "${{ env.APP_DIR }}/" \
            -ov \
            -format UDZO \
            -o "Configura_Konica_Mac-${VERSION}.dmg"

          echo "DMG_PATH=Configura_Konica_Mac-${VERSION}.dmg" >> $GITHUB_ENV
          echo "DMG creat: $(du -sh Configura_Konica_Mac-${VERSION}.dmg)"

      - name: Adjunta el DMG al Release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.DMG_PATH }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
