name: Construeix el DMG

on:
  release:
    types: [published]

jobs:
  build-dmg:
    name: Crea el DMG en macOS
    runs-on: macos-latest

    steps:

      - name: Descarrega el repositori
        uses: actions/checkout@v5

      - name: Descarrega el ZIP del Release
        run: |
          ASSET_URL=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets" \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          for a in assets:
              if a['name'].endswith('.zip') and 'Source' not in a['name']:
                  print(a['url'])
                  break
          ")
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o app.zip
          echo "ZIP descarregat: $(du -sh app.zip)"
          echo "Contingut del ZIP:"
          unzip -l app.zip | grep ".app" | head -5

      - name: Prepara l'app i crea el DMG
        run: |
          VERSION="${{ github.event.release.tag_name }}"

          unzip app.zip

          echo "=== Estructura descomprimida ==="
          find . -name "*.app" -maxdepth 4
          find . -name "Configura_Konica_Mac" -maxdepth 6

          APP_PATH=$(find . -name "Configura_Konica_Mac.app" -maxdepth 4 | head -1)
          APP_DIR=$(dirname "$APP_PATH")
          EXEC_PATH="$APP_PATH/Contents/MacOS/Configura_Konica_Mac"

          echo "App: $APP_PATH"
          echo "Dir: $APP_DIR"
          echo "Exec: $EXEC_PATH"

          xattr -cr "$APP_PATH" 2>/dev/null || true
          chmod +x "$EXEC_PATH"

          hdiutil create \
            -volname "Configura Konica Mac" \
            -srcfolder "$APP_DIR/" \
            -ov \
            -format UDZO \
            -o "Configura_Konica_Mac-${VERSION}.dmg"

          echo "DMG_PATH=Configura_Konica_Mac-${VERSION}.dmg" >> $GITHUB_ENV
          ls -lh "Configura_Konica_Mac-${VERSION}.dmg"

      - name: Adjunta el DMG al Release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.DMG_PATH }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
